{% load i18n %}
<form method="get" class="row g-2 align-items-end mb-4">
  <div class="col-sm-auto">
    <label class="form-label small fw-semibold mb-1">{% trans "From" %}</label>
    <input type="date" name="date_from" class="form-control form-control-sm"
           value="{{ date_from }}">
  </div>
  <div class="col-sm-auto">
    <label class="form-label small fw-semibold mb-1">{% trans "To" %}</label>
    <input type="date" name="date_to" class="form-control form-control-sm"
           value="{{ date_to }}">
  </div>
  <div class="col-sm-auto">
    <button type="submit" class="btn btn-sm btn-primary">
      <i class="bi bi-funnel"></i> {% trans "Apply" %}
    </button>
    {% if date_from or date_to %}
    <a href="{{ clear_url }}" class="btn btn-sm btn-outline-secondary ms-1">
      <i class="bi bi-x"></i> {% trans "Clear" %}
    </a>
    {% endif %}
  </div>
  {% if date_from or date_to %}
  <div class="col-12">
    <span class="badge bg-light text-dark border small">
      <i class="bi bi-calendar-range"></i>
      {% if date_from %}{{ date_from }}{% else %}…{% endif %} →
      {% if date_to %}{{ date_to }}{% else %}{% trans "today" %}{% endif %}
    </span>
  </div>
  {% endif %}
</form>
